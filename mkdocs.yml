---
site_name: Effectus
site_description: Typed rule compiler and durable execution runtime
site_url: https://josephjohncox.github.io/effectus/
repo_url: https://github.com/josephjohncox/effectus
repo_name: josephjohncox/effectus
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 Joseph Cox
exclude_docs: |
  /README.md

nav:
  - Home: index.md
  - Getting started: GETTING_STARTED.md
  - Concepts:
      - Basics: BASICS.md
      - System intent: SYSTEM_INTENT.md
      - Glossary: GLOSSARY.md
  - Build and integrate:
      - Integration models: INTEGRATION.md
      - v0.3 compatibility: COMPATIBILITY.md
      - CLI reference: COMMANDS.md
      - gRPC execution: GRPC_EXECUTION.md
      - Client examples: CLIENT_EXAMPLES.md
      - Fact sources: FACT_SOURCES.md
      - Extension system: EXTENSION_SYSTEM.md
      - Tutorials: TUTORIALS.md
  - Operate:
      - Runtime configuration: RUNTIME_CONFIG.md
      - Runtime lifecycle: LIFECYCLE.md
      - Runtime guarantees: GUARANTEES.md
      - Production runbook: PRODUCTION_RUNBOOK.md
      - Durable saga protocol: DURABLE_SAGA_PROTOCOL.md
  - Architecture:
      - Architecture: ARCHITECTURE.md
      - Design notes: design.md
      - Coherent flow: coherent_flow.md
      - Dependency audit: DEPENDENCY_AUDIT.md
  - Theory:
      - Scope: theory/README.md
      - Basic model: theory/basic.md
      - Computational model: theory/computational_model.md
      - Capabilities: theory/capabilities.md
      - Compensation: theory/compensation.md
      - Verb extension: theory/verb_extension.md
      - Appendix: theory/appendix.md
  - Releases:
      - v0.3.0: releases/v0.3.0.md
      - v0.2.1: releases/v0.2.1.md

theme:
  name: material
  logo: assets/effectus-small.png
  favicon: assets/effectus-small.png
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
