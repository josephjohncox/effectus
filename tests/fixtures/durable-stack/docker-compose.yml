services:
  postgres:
    build:
      context: ../cdc-stack/postgres
    image: effectus/postgres-wal2json:16-secure
    environment:
      POSTGRES_USER: effectus
      POSTGRES_PASSWORD: effectus
      POSTGRES_DB: effectus_saga
    ports:
      - "55433:5432"

  redis:
    image: >-
      redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "56379:6379"
