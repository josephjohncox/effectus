services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: effectus
      POSTGRES_PASSWORD: effectus
      POSTGRES_DB: effectus_saga
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effectus -d effectus_saga"]
      interval: 2s
      timeout: 3s
      retries: 30
