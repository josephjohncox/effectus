name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        # v9
        uses: >-
          golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.7.2
          args: --config=.golangci.yml --timeout=5m

      - name: Set up Buf
        # v1.50.0
        uses: >-
          bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          github_token: ${{ github.token }}

      - name: Buf format
        run: buf format -d --exit-code

      - name: Buf lint
        run: buf lint

      - name: Check protobuf compatibility and committed Go bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          git update-ref refs/heads/buf-breaking-main refs/remotes/origin/main
          buf breaking --against '.git#branch=buf-breaking-main'
          buf generate --template buf.gen.go.yaml
          git diff --exit-code -- gen

  sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check SQL generation and queries
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          (cd runtime && sqlc generate && sqlc vet)
          git diff --exit-code -- runtime/internal/db

      # The older migrations predate the SQL style baseline. Keep the gate
      # scoped to migrations introduced or changed by the durable runtime.
      - name: Lint durable runtime migrations
        run: |
          python -m pip install sqlfluff==3.5.0
          sqlfluff lint --dialect postgres \
            schema/migrations/10002_execution_ledger.sql \
            schema/migrations/10003_kafka_delivery_ledger.sql

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Audit Go modules
        run: |
          set -e
          govulncheck ./...
          for module in \
            examples \
            examples/buf_integration \
            examples/business_facts \
            examples/business_verbs \
            examples/coherent_flow \
            examples/extension_system \
            examples/fraud_e2e/mocks; do
            (cd "$module" && govulncheck ./...)
          done

  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        # v1.50.0
        uses: >-
          bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          github_token: ${{ github.token }}

      - name: Check generated protobuf examples
        run: |
          cd examples/proto_driven_development/company_example
          buf lint
          buf generate
          git diff --exit-code -- gen

      - name: Build all example modules
        run: |
          set -e
          for module in \
            examples \
            examples/buf_integration \
            examples/business_facts \
            examples/business_verbs \
            examples/coherent_flow \
            examples/extension_system \
            examples/fraud_e2e/mocks; do
            (cd "$module" && go test ./...)
          done

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Compile and lint extension
        run: npm run compile && npm run lint

  container-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build -t effectus:audit .

      - name: Scan fixed high and critical findings
        run: |
          trivy="aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe0"
          trivy+="86a917230e818dc9f8528e3c852f7b1aff648949b6258d1c"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 effectus:audit

      - name: Scan pinned Redis image
        run: |
          image="redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcb"
          image+="beee91773b6aa36c49dac28ecfe28eadf"
          trivy="aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe0"
          trivy+="86a917230e818dc9f8528e3c852f7b1aff648949b6258d1c"
          docker pull "$image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "$image"

  example-container-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fraud-mocks
            context: examples/fraud_e2e/mocks
          - name: postgres-wal2json
            context: examples/cdc_stack/postgres
          - name: mysql
            context: examples/cdc_stack/mysql
          - name: rabbitmq
            context: examples/cdc_stack/rabbitmq
          - name: minio
            context: examples/warehouse_sources/devstack/minio
          - name: minio-mc
            context: examples/warehouse_sources/devstack/minio-mc
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build example image
        run: >-
          docker build -t "effectus/${{ matrix.name }}:audit"
          "${{ matrix.context }}"

      - name: Scan fixed high and critical findings
        run: |
          trivy="aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe0"
          trivy+="86a917230e818dc9f8528e3c852f7b1aff648949b6258d1c"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 \
            "effectus/${{ matrix.name }}:audit"

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start CDC stack
        run: docker compose -f examples/cdc_stack/docker-compose.yml up -d

      - name: Wait for services
        run: |
          set -e
          for i in $(seq 1 30); do
            if docker compose -f examples/cdc_stack/docker-compose.yml \
              exec -T postgres pg_isready -U effectus >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker compose -f examples/cdc_stack/docker-compose.yml \
              exec -T mysql mysqladmin ping -proot >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker compose -f examples/cdc_stack/docker-compose.yml \
              exec -T rabbitmq rabbitmq-diagnostics -q ping \
              >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: CDC integration tests
        env:
          POSTGRES_DSN: "postgres://effectus:effectus@localhost:5432/\
            effectus_cdc?sslmode=disable"
          MYSQL_HOST: localhost
          MYSQL_PORT: "3306"
          MYSQL_USER: effectus
          MYSQL_PASSWORD: effectus
          MYSQL_DATABASE: effectus_cdc
          MYSQL_DSN: >-
            effectus:effectus@tcp(localhost:3306)/effectus_cdc?parseTime=true
        run: go test -tags=integration ./adapters/postgres ./adapters/mysql

      - name: Stop CDC stack
        if: always()
        run: docker compose -f examples/cdc_stack/docker-compose.yml down -v

  saga:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start saga stack
        run: docker compose -f examples/saga_stack/docker-compose.yml up -d

      - name: Wait for services
        run: |
          set -e
          for i in $(seq 1 30); do
            if docker compose -f examples/saga_stack/docker-compose.yml \
              exec -T postgres pg_isready -U effectus >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if docker compose -f examples/saga_stack/docker-compose.yml \
              exec -T redis redis-cli ping >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Saga integration tests
        env:
          DB_DSN: "postgres://effectus:effectus@localhost:55433/\
            effectus_saga?sslmode=disable"
          POSTGRES_DSN: "postgres://effectus:effectus@localhost:55433/\
            effectus_saga?sslmode=disable"
          REDIS_ADDR: localhost:56379
        run: go test -tags=integration ./cmd/effectusd ./schema

      - name: Stop saga stack
        if: always()
        run: docker compose -f examples/saga_stack/docker-compose.yml down -v
