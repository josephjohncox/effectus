# yamllint disable rule:line-length
---
name: CI

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enforce repository guardrails
        run: |
          go test ./internal/guardrails/...
          go run ./internal/guardrails/cmd check

      - name: Test every discovered Go module
        run: |
          set -eu
          go run ./internal/guardrails/cmd modules | while IFS= read -r module; do
            echo "==> $module"
            (cd "$module" && go test ./...)
          done

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        # v9
        uses: >-
          golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.7.2
          args: --config=.golangci.yml --timeout=5m

      - name: Set up Buf
        # v1.50.0
        uses: >-
          bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          github_token: ${{ github.token }}

      - name: Buf format
        run: buf format -d --exit-code

      - name: Buf lint
        run: buf lint

      - name: Check protobuf compatibility and committed Go bindings
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          git update-ref refs/heads/buf-breaking-main refs/remotes/origin/main
          scripts/check-buf-breaking.sh '.git#branch=buf-breaking-main'
          buf generate --template buf.gen.go.yaml
          git diff --exit-code -- gen

      - name: Execute documentation contracts
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          go test ./cmd/effectusc ./cmd/effectusd -run 'TestDocumented'

  sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Check SQL generation and queries
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
          (cd runtime && sqlc generate && sqlc vet)
          git diff --exit-code -- runtime/internal/db

      # The older migrations predate the SQL style baseline. Keep the gate
      # scoped to migrations introduced or changed by the durable runtime.
      - name: Lint durable runtime migrations
        run: |
          python -m pip install sqlfluff==3.5.0
          sqlfluff lint --dialect postgres \
            schema/migrations/10002_execution_ledger.sql \
            schema/migrations/10003_kafka_delivery_ledger.sql \
            schema/migrations/10004_retention_indexes.sql

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Audit every discovered Go module
        run: |
          set -eu
          go run ./internal/guardrails/cmd modules | while IFS= read -r module; do
            echo "==> $module"
            (cd "$module" && govulncheck ./...)
          done

  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        # v1.50.0
        uses: >-
          bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          github_token: ${{ github.token }}

      - name: Install pinned just
        run: cargo install just --locked --version 1.38.0

      - name: Test all example modules through the repository recipe
        run: just test-examples

      - name: Run embedded checked-runtime example
        working-directory: examples
        run: go run ./embedded_orders

      - name: Compile standalone business-executor bundle
        run: |
          mkdir -p out/standalone_executor
          go run ./cmd/effectusc bundle \
            --name order-review --version 1.0.0 \
            --schema-dir examples/standalone_executor/schema \
            --verb-dir examples/standalone_executor/extensions \
            --rules-dir examples/order_review/rules \
            --output out/standalone_executor/bundle.json

  standalone-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run standalone daemon and business executor
        env:
          EFFECTUS_API_TOKEN: ci-api-token
          EXECUTOR_TOKEN: ci-executor-token
        run: examples/standalone_executor/scripts/run.sh

      - name: Stop standalone demo
        if: always()
        run: examples/standalone_executor/scripts/down.sh

  kafka-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Start pinned Redpanda service
        run: |
          image="docker.redpanda.com/redpandadata/redpanda:v24.2.10@sha256:6d627e3ebdc05438d1e8e3b55695ac1a7a0f79e7d5ca90b3b0f12dc984633e83"
          docker run -d --name redpanda -p 9092:9092 "$image" redpanda start \
            --overprovisioned --smp 1 --memory 512M --reserve-memory 0M \
            --node-id 0 --check=false --kafka-addr 0.0.0.0:9092 \
            --advertise-kafka-addr 127.0.0.1:9092
          for _ in $(seq 1 60); do
            docker exec redpanda rpk cluster health \
              >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs redpanda
          exit 1
      - name: Run Kafka commit and restart harness
        env:
          KAFKA_BROKERS: localhost:9092
        run: go test -v -count=1 -tags=integration ./internal/adapters/kafka -run '^TestKafkaConsumerGroupCommitAndRestart$'

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit --audit-level=moderate

      - name: Compile and lint extension
        run: npm run compile && npm run lint

      - name: Activate packaged VSIX and invoke contributed commands
        run: xvfb-run -a npm run test:package

  container-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build -t effectus:audit .

      - name: Verify normalized rootfs reproducibility
        run: |
          set -euo pipefail
          epoch=$(git show -s --format=%ct)
          docker build --no-cache --build-arg SOURCE_DATE_EPOCH="$epoch" \
            -t effectus:audit-rebuild .
          for image in audit audit-rebuild; do
            root="$RUNNER_TEMP/rootfs-$image"
            mkdir -p "$root"
            container=$(docker create "effectus:$image")
            docker export "$container" | tar -xf - -C "$root"
            docker rm "$container"
            (
              cd "$root"
              find . -printf '%y %m %U %G %p\n' | LC_ALL=C sort
              find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            ) > "$RUNNER_TEMP/$image.rootfs"
          done
          diff -u "$RUNNER_TEMP/audit.rootfs" \
            "$RUNNER_TEMP/audit-rebuild.rootfs"

      - name: Scan fixed high and critical findings
        run: |
          trivy="aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe0"
          trivy+="86a917230e818dc9f8528e3c852f7b1aff648949b6258d1c"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 effectus:audit

      - name: Scan pinned Redis image
        run: |
          image="redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcb"
          image+="beee91773b6aa36c49dac28ecfe28eadf"
          trivy="aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe0"
          trivy+="86a917230e818dc9f8528e3c852f7b1aff648949b6258d1c"
          docker pull "$image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 "$image"

  example-container-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: business-executor
            context: .
            dockerfile: examples/standalone_executor/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build example image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          args=()
          if [ -n "$DOCKERFILE" ]; then
            args+=(--file "$DOCKERFILE")
          fi
          docker build "${args[@]}" \
            -t "effectus/${{ matrix.name }}:audit" \
            "${{ matrix.context }}"

      - name: Scan fixed high and critical findings
        run: |
          trivy="aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe0"
          trivy+="86a917230e818dc9f8528e3c852f7b1aff648949b6258d1c"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 \
            "effectus/${{ matrix.name }}:audit"

  release-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate workflows and release preflight failures
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint .github/workflows/ci.yml \
            .github/workflows/docs.yml \
            .github/workflows/publish.yml \
            .github/workflows/recover-release.yml
          .github/scripts/release-preflight_test.sh
          .github/scripts/recovery-bundle-layout_test.sh
          .github/scripts/reproducible-archive_test.sh
          scripts/compat-proxy-smoke_test.sh
          if grep -Eq 'workflow_dispatch|--clobber|--generate-notes' .github/workflows/publish.yml; then
            echo "unsafe release workflow path detected" >&2
            exit 1
          fi
          grep -Fq -- '--notes-file' .github/workflows/publish.yml
          grep -Fq -- 'docs/releases/v' .github/workflows/publish.yml
          grep -Fq -- "cosign sign --yes \"\$chart_ref\"" \
            .github/workflows/publish.yml
          publish_bundle="bundle=ghcr.io/\$owner/bundles/order-review:\$version"
          bundle_repo="bundle_repo=ghcr.io/\$owner/bundles/order-review"
          grep -Fq -- "$publish_bundle" .github/workflows/publish.yml
          grep -Fq -- "$bundle_repo" .github/workflows/publish.yml
          grep -Fq -- 'recovery-bundle-layout.sh' .github/workflows/recover-release.yml
          grep -Fq -- "bundle_repo=ghcr.io/\$owner/\$bundle_repo_path" \
            .github/workflows/recover-release.yml
          grep -Fq -- 'SOURCE_DATE_EPOCH: "0"' .github/workflows/publish.yml \
            .github/workflows/recover-release.yml
          grep -Fq -- 'Validate promoted references' \
            .github/workflows/recover-release.yml
          grep -Fq -- 'Create GitHub release completion marker last' \
            .github/workflows/recover-release.yml
          grep -Fq -- 'Create GitHub release completion marker last' .github/workflows/publish.yml
          grep -Fq -- 'compatibility-proxy-smoke:' .github/workflows/publish.yml
          grep -Fq -- 'needs: release' .github/workflows/publish.yml
          grep -Fq -- 'scripts/compat-proxy-smoke.sh' .github/workflows/publish.yml
          if grep -Fq -- 'EFFECTUS_COMPAT_TEST_GOPROXY' .github/workflows/publish.yml; then
            echo "publish workflow must use the default public compatibility proxy" >&2
            exit 1
          fi

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Install pinned chart tools
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - name: Run the chart recipe and validate contract fixtures
        run: |
          set -euo pipefail
          image="ghcr.io/yannh/kubeconform:v0.6.7@sha256:0925177fb05b44ce18574076141b5c3d83235e1904d3f952182ac99ddc45762c"
          docker pull "$image"
          for file in charts/effectusd/test-values/*.yaml; do
            helm lint charts/effectusd -f "$file"
            helm template effectusd charts/effectusd -f "$file" |
              docker run --rm -i "$image" -strict -summary
          done
          render=$(mktemp)
          helm template effectusd charts/effectusd \
            -f charts/effectusd/test-values/configmap.yaml > "$render"
          grep -q 'type: Recreate' "$render"
          grep -q 'replicas: 1' "$render"
          grep -q -- '--http-addr=:8080' "$render"
          grep -q -- '--metrics-addr=:9090' "$render"
          grep -q -- '--oci-cache-dir=/data/bundles' "$render"
          grep -q 'effectus.dev/rollout-nonce: "configmap-contract"' "$render"
          grep -q 'requests:' "$render"
          grep -q 'limits:' "$render"
          if helm template effectusd charts/effectusd \
            -f charts/effectusd/test-values/oci-tag.yaml \
            --set migrations.enabled=true \
            --set migrations.existingSecret=effectusd-postgres >/dev/null 2>&1; then
            echo "migration and runtime Secrets must differ" >&2
            exit 1
          fi

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-sensitive runtime and adapter tests
        run: >-
          go test -race ./runtime ./schema ./cmd/effectusd
          ./internal/adapters/postgres ./internal/adapters/amqp ./internal/adapters/mysql ./internal/adapters/grpc

  formal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned TLC
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "dbcc75552f21978a4846688b8e23be1a6b6c0b3fcee35d78fec2df167958ec94  /tmp/tla2tools.jar" | sha256sum --check
          printf '#!/bin/sh\nexec java -cp /tmp/tla2tools.jar tlc2.TLC "$@"\n' |
            sudo tee /usr/local/bin/tlc >/dev/null
          sudo chmod 0755 /usr/local/bin/tlc
      - name: Model checks
        run: |
          tlc formal/Saga.tla -config formal/Saga.cfg
          tlc formal/GenerationSwap.tla -config formal/GenerationSwap.cfg

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start CDC fixture stack
        run: docker compose -f tests/fixtures/cdc-stack/docker-compose.yml up -d

      - name: Wait for services
        run: |
          set -e
          for _ in $(seq 1 30); do
            if docker compose -f tests/fixtures/cdc-stack/docker-compose.yml \
              exec -T postgres pg_isready -U effectus >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for _ in $(seq 1 30); do
            if docker compose -f tests/fixtures/cdc-stack/docker-compose.yml \
              exec -T mysql mysqladmin ping -proot >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for _ in $(seq 1 30); do
            if docker compose -f tests/fixtures/cdc-stack/docker-compose.yml \
              exec -T rabbitmq rabbitmq-diagnostics -q ping \
              >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: CDC integration tests
        env:
          POSTGRES_DSN: "postgres://effectus:effectus@localhost:5432/\
            effectus_cdc?sslmode=disable"
          MYSQL_HOST: localhost
          MYSQL_PORT: "3306"
          MYSQL_USER: effectus
          MYSQL_PASSWORD: effectus
          MYSQL_DATABASE: effectus_cdc
          MYSQL_DSN: >-
            effectus:effectus@tcp(localhost:3306)/effectus_cdc?parseTime=true
        run: go test -race -tags=integration ./internal/adapters/postgres ./internal/adapters/mysql

      - name: Stop CDC fixture stack
        if: always()
        run: docker compose -f tests/fixtures/cdc-stack/docker-compose.yml down -v

  saga:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Start durable fixture stack
        run: docker compose -f tests/fixtures/durable-stack/docker-compose.yml up -d

      - name: Wait for services
        run: |
          set -e
          for _ in $(seq 1 30); do
            if docker compose -f tests/fixtures/durable-stack/docker-compose.yml \
              exec -T postgres pg_isready -U effectus >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          for _ in $(seq 1 30); do
            if docker compose -f tests/fixtures/durable-stack/docker-compose.yml \
              exec -T redis redis-cli ping >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

      - name: Apply durable migrations once
        env:
          EFFECTUS_POSTGRES_DSN: "postgres://effectus:effectus@localhost:55433/\
            effectus_saga?sslmode=disable"
        run: go run ./cmd/effectusd --database-migrations=apply

      - name: Saga integration tests
        env:
          DB_DSN: "postgres://effectus:effectus@localhost:55433/\
            effectus_saga?sslmode=disable"
          POSTGRES_DSN: "postgres://effectus:effectus@localhost:55433/\
            effectus_saga?sslmode=disable"
          REDIS_ADDR: localhost:56379
        run: go test -p 1 -tags=integration ./runtime ./schema ./cmd/effectusd

      - name: Redis Streams adapter integration tests
        env:
          REDIS_ADDR: localhost:56379
        run: go test -race -tags=integration ./internal/adapters/redis

      - name: Stop durable fixture stack
        if: always()
        run: docker compose -f tests/fixtures/durable-stack/docker-compose.yml down -v

  runtime-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Race-enabled runtime checks
        run: go test -race ./runtime ./schema ./schema/verb ./cmd/effectusd
