# yamllint disable rule:line-length
# yamllint disable rule:truthy
# yamllint disable rule:comments
---
name: Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: quality
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3

      - name: Install pinned release tools before registry writes
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.20.3
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3
          go install github.com/anchore/syft/cmd/syft@v1.22.0
          go install oras.land/oras/cmd/oras@v1.2.2

      - name: Resolve immutable release coordinates
        id: release
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          OWNER=${OWNER:-}
          test -n "$OWNER"
          version="${GITHUB_REF_NAME#v}"
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          {
            echo "version=$version"
            echo "image=ghcr.io/$owner/effectusd:$version"
            echo "bundle=ghcr.io/$owner/bundles/order-review:$version"
            echo "chart=ghcr.io/$owner/helm/effectusd:$version"
            echo "image_repo=ghcr.io/$owner/effectusd"
            echo "bundle_repo=ghcr.io/$owner/bundles/order-review"
            echo "chart_repo=ghcr.io/$owner/helm/effectusd"
            echo "chart_stage_repo=ghcr.io/$owner/helm-staging-${GITHUB_SHA}/effectusd"
          } >> "$GITHUB_OUTPUT"

      - name: Fail closed when release outputs exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          preflight_docker_config=$(mktemp -d)
          trap 'rm -rf "$preflight_docker_config"' EXIT
          export DOCKER_CONFIG=$preflight_docker_config
          printf '%s' "$GH_TOKEN" | crane auth login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          .github/scripts/release-preflight.sh \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.image }}" \
            "${{ steps.release.outputs.bundle }}" \
            "${{ steps.release.outputs.chart }}"

      - name: Build all local release inputs
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=""
            archive="effectus-${VERSION}-${os}-${arch}.tar.gz"
            if [ "$os" = windows ]; then
              suffix=".exe"
              archive="effectus-${VERSION}-${os}-${arch}.zip"
            fi
            work="dist/effectus-${os}-${arch}"
            mkdir -p "$work"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -buildid=" \
              -o "$work/effectusc$suffix" ./cmd/effectusc
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w -buildid=" \
              -o "$work/effectusd$suffix" ./cmd/effectusd
            if [ "$os" = windows ]; then
              (cd "$work" && touch -d "@$SOURCE_DATE_EPOCH" ./* && zip -X -q "../$archive" ./*)
            else
              tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
                --owner=0 --group=0 --numeric-owner -C "$work" \
                -czf "dist/$archive" .
            fi
            rm -rf "$work"
          done
          go run ./examples/standalone_executor/bundle.go \
            "dist/order-review-${VERSION}.json" release-placeholder-token "$VERSION"
          go run ./cmd/effectusc check --bundle "dist/order-review-${VERSION}.json"
          helm package charts/effectusd --destination dist \
            --version "$VERSION" --app-version "$VERSION"
          docker build --build-arg SOURCE_DATE_EPOCH=0 \
            --tag effectus:release .

      - name: Build VS Code extension
        working-directory: tools/vscode-extension
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "$VERSION"
          find . -maxdepth 1 -type f -name '*.vsix' -delete
          npm ci
          npm run package
          mv "effectus-language-support-${VERSION}.vsix" ../../dist/

      - name: Scan and describe local release inputs
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          trivy="aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$trivy" image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 effectus:release
          syft effectus:release -o cyclonedx-json=dist/image-sbom.cdx.json
          syft "dir:charts/effectusd" -o cyclonedx-json=dist/chart-sbom.cdx.json
          syft "file:dist/order-review-${VERSION}.json" \
            -o cyclonedx-json=dist/bundle-sbom.cdx.json
          printf '{"buildType":"https://github.com/%s/.github/workflows/publish.yml","builder":{"id":"https://github.com/actions/runner"},"invocation":{"configSource":{"uri":"git+https://github.com/%s@%s","digest":{"sha1":"%s"}}}}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_REF" "$GITHUB_SHA" \
            > dist/release-provenance.json

      - name: Sign and verify local checksum manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          (cd dist && find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' \
            -printf '%f\n' | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem dist/SHA256SUMS
          cosign verify-blob \
            --certificate dist/SHA256SUMS.pem \
            --signature dist/SHA256SUMS.sig \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/v${VERSION}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS

      - name: Log in after preflight and local validation
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish, sign, and verify staging references
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_REPO: ${{ steps.release.outputs.image_repo }}
          BUNDLE_REPO: ${{ steps.release.outputs.bundle_repo }}
          CHART_STAGE_REPO: ${{ steps.release.outputs.chart_stage_repo }}
        run: |
          set -euo pipefail
          image_stage="${IMAGE_REPO}:staging-${GITHUB_SHA}"
          bundle_stage="${BUNDLE_REPO}:staging-${GITHUB_SHA}"
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg SOURCE_DATE_EPOCH=0 \
            --provenance=mode=max --sbom=true --push --tag "$image_stage" .
          go run .github/scripts/publish-source-bundle.go \
            --bundle "dist/order-review-${VERSION}.json" --oci-ref "$bundle_stage"
          helm push "dist/effectusd-${VERSION}.tgz" \
            "oci://${CHART_STAGE_REPO%/effectusd}"
          image_digest=$(crane digest "$image_stage")
          bundle_digest=$(crane digest "$bundle_stage")
          chart_digest=$(crane digest "${CHART_STAGE_REPO}:${VERSION}")
          for ref in \
            "${IMAGE_REPO}@${image_digest}" \
            "${BUNDLE_REPO}@${bundle_digest}" \
            "${CHART_STAGE_REPO}@${chart_digest}"; do
            cosign sign --yes "$ref"
            cosign attest --yes --type slsaprovenance \
              --predicate dist/release-provenance.json "$ref"
            cosign verify "$ref" \
              --certificate-identity-regexp \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            cosign verify-attestation --type slsaprovenance "$ref" \
              --certificate-identity-regexp \
                "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done
          cosign attest --yes --type cyclonedx \
            --predicate dist/image-sbom.cdx.json "${IMAGE_REPO}@${image_digest}"
          cosign attest --yes --type cyclonedx \
            --predicate dist/bundle-sbom.cdx.json "${BUNDLE_REPO}@${bundle_digest}"
          cosign attest --yes --type cyclonedx \
            --predicate dist/chart-sbom.cdx.json "${CHART_STAGE_REPO}@${chart_digest}"
          cosign verify-attestation --type cyclonedx "${IMAGE_REPO}@${image_digest}" \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation --type cyclonedx "${BUNDLE_REPO}@${bundle_digest}" \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation --type cyclonedx "${CHART_STAGE_REPO}@${chart_digest}" \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          printf '%s\n' "$image_digest" > "$RUNNER_TEMP/image.digest"
          printf '%s\n' "$bundle_digest" > "$RUNNER_TEMP/bundle.digest"
          printf '%s\n' "$chart_digest" > "$RUNNER_TEMP/chart.digest"

      - name: Promote immutable version references in order
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_REPO: ${{ steps.release.outputs.image_repo }}
          BUNDLE_REPO: ${{ steps.release.outputs.bundle_repo }}
          CHART_REPO: ${{ steps.release.outputs.chart_repo }}
          CHART_STAGE_REPO: ${{ steps.release.outputs.chart_stage_repo }}
        run: |
          set -euo pipefail
          image_digest=$(cat "$RUNNER_TEMP/image.digest")
          bundle_digest=$(cat "$RUNNER_TEMP/bundle.digest")
          chart_digest=$(cat "$RUNNER_TEMP/chart.digest")
          check_absent() {
            ref=$1
            error_file=$(mktemp)
            if crane digest "$ref" >/dev/null 2>"$error_file"; then
              echo "release destination appeared before promotion: $ref" >&2
              rm -f "$error_file"
              exit 1
            fi
            grep -Eqi 'MANIFEST_UNKNOWN|NAME_UNKNOWN|manifest unknown|404 Not Found|status code 404' "$error_file" || {
              echo "cannot prove release destination is absent: $ref" >&2
              cat "$error_file" >&2
              rm -f "$error_file"
              exit 1
            }
            rm -f "$error_file"
          }
          # Repository settings must reject tag mutation. These last-moment
          # checks additionally fail closed if another publisher wins a race.
          check_absent "${IMAGE_REPO}:${VERSION}"
          crane tag "${IMAGE_REPO}@${image_digest}" "$VERSION"
          test "$(crane digest "${IMAGE_REPO}:${VERSION}")" = "$image_digest"
          check_absent "${BUNDLE_REPO}:${VERSION}"
          crane tag "${BUNDLE_REPO}@${bundle_digest}" "$VERSION"
          test "$(crane digest "${BUNDLE_REPO}:${VERSION}")" = "$bundle_digest"
          check_absent "${CHART_REPO}:${VERSION}"
          oras copy --recursive "${CHART_STAGE_REPO}@${chart_digest}" \
            "${CHART_REPO}:${VERSION}"
          test "$(crane digest "${CHART_REPO}:${VERSION}")" = "$chart_digest"
          # Cosign signatures are repository-scoped. Sign the promoted chart in
          # its final repository instead of assuming recursive copy relocates it.
          chart_ref="${CHART_REPO}@${chart_digest}"
          cosign sign --yes "$chart_ref"
          cosign attest --yes --type slsaprovenance \
            --predicate dist/release-provenance.json "$chart_ref"
          cosign attest --yes --type cyclonedx \
            --predicate dist/chart-sbom.cdx.json "$chart_ref"
          cosign verify "$chart_ref" \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation --type slsaprovenance "$chart_ref" \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation --type cyclonedx "$chart_ref" \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Create and sign release completion manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_REPO: ${{ steps.release.outputs.image_repo }}
          BUNDLE_REPO: ${{ steps.release.outputs.bundle_repo }}
          CHART_REPO: ${{ steps.release.outputs.chart_repo }}
        run: |
          set -euo pipefail
          image_digest=$(cat "$RUNNER_TEMP/image.digest")
          bundle_digest=$(cat "$RUNNER_TEMP/bundle.digest")
          chart_digest=$(cat "$RUNNER_TEMP/chart.digest")
          jq -n --arg version "$VERSION" --arg commit "$GITHUB_SHA" \
            --arg image "${IMAGE_REPO}@${image_digest}" \
            --arg bundle "${BUNDLE_REPO}@${bundle_digest}" \
            --arg chart "${CHART_REPO}@${chart_digest}" \
            '{schema_version:1,version:$version,commit:$commit,image:$image,bundle:$bundle,chart:$chart,complete:true}' \
            > dist/release-manifest.json
          cosign sign-blob --yes --output-signature dist/release-manifest.json.sig \
            --output-certificate dist/release-manifest.json.pem dist/release-manifest.json
          cosign verify-blob --signature dist/release-manifest.json.sig \
            --certificate dist/release-manifest.json.pem \
            --certificate-identity-regexp \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/publish.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/release-manifest.json

      - name: Create GitHub release completion marker last
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --notes-file "docs/releases/v${VERSION}.md" \
            --title "Effectus $GITHUB_REF_NAME"

  # The release job creates the root release completion marker as its last step.
  # Do not resolve the public module before that release exists.
  compatibility-proxy-smoke:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout released root module
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Resolve v0.3 compatibility packages from the Go proxy after root release
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          for attempt in $(seq 1 20); do
            if scripts/compat-proxy-smoke.sh "$version"; then
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              exit 1
            fi
            sleep 15
          done
