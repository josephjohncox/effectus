name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish (for example, 1.2.3)"
        required: true
        type: string
      publish_image:
        description: "Publish ghcr.io container image"
        required: true
        default: true
        type: boolean
      publish_bundle:
        description: "Publish OCI rule bundle"
        required: true
        default: true
        type: boolean
      publish_chart:
        description: "Publish Helm chart to ghcr.io (OCI)"
        required: true
        default: true
        type: boolean
      bundle_name:
        description: "Bundle name (default: flow-ui-demo)"
        required: false
        type: string
      bundle_version:
        description: "Bundle version (default: release version)"
        required: false
        type: string
      bundle_schema_dir:
        description: "Schema directory (default: examples/flow_ui_demo/schema)"
        required: false
        type: string
      bundle_rules_dir:
        description: "Rules directory (default: examples/flow_ui_demo/rules)"
        required: false
        type: string
      bundle_verb_dir:
        description: >-
          Verb spec directory (default: examples/flow_ui_demo/verbs)
        required: false
        type: string
      bundle_oci_ref:
        description: >-
          OCI reference override (e.g., ghcr.io/org/bundles/demo:v1)
        required: false
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: >-
          bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        # v1.50.0
        with:
          github_token: ${{ github.token }}
      - name: Validate release source
        run: |
          go test ./...
          go vet ./...
          buf format -d --exit-code
          buf lint
          git update-ref refs/heads/buf-breaking-main refs/remotes/origin/main
          buf breaking --against '.git#branch=buf-breaking-main'

  publish-image:
    needs: validate
    if: github.event_name == 'push' || inputs.publish_image == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
              echo "version is required for manual branch publication" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+'
          SEMVER_RE="${SEMVER_RE}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?"
          SEMVER_RE="${SEMVER_RE}(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$"
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_RE"; then
            echo "invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: >-
          docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: >-
          docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        # v5
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/effectusd
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.version.outputs.version }}

  publish-bundle:
    needs: validate
    if: github.event_name == 'push' || inputs.publish_bundle == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
              echo "version is required for manual branch publication" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+'
          SEMVER_RE="${SEMVER_RE}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?"
          SEMVER_RE="${SEMVER_RE}(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$"
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_RE"; then
            echo "invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OCI bundle
        run: |
          BUNDLE_NAME="${{ inputs.bundle_name }}"
          if [ -z "$BUNDLE_NAME" ]; then
            BUNDLE_NAME="flow-ui-demo"
          fi

          BUNDLE_VERSION="${{ inputs.bundle_version }}"
          if [ -z "$BUNDLE_VERSION" ]; then
            BUNDLE_VERSION="${{ steps.version.outputs.version }}"
          fi

          SCHEMA_DIR="${{ inputs.bundle_schema_dir }}"
          if [ -z "$SCHEMA_DIR" ]; then
            SCHEMA_DIR="examples/flow_ui_demo/schema"
          fi

          RULES_DIR="${{ inputs.bundle_rules_dir }}"
          if [ -z "$RULES_DIR" ]; then
            RULES_DIR="examples/flow_ui_demo/rules"
          fi

          VERB_DIR="${{ inputs.bundle_verb_dir }}"
          if [ -z "$VERB_DIR" ]; then
            VERB_DIR="examples/flow_ui_demo/verbs"
          fi

          VERB_SCHEMA="examples/flow_ui_demo/schema/flow_verbs.json"

          OCI_REF="${{ inputs.bundle_oci_ref }}"
          if [ -z "$OCI_REF" ]; then
            OCI_REPO="ghcr.io/${{ github.repository_owner }}/bundles"
            OCI_REF="${OCI_REPO}/${BUNDLE_NAME}:${BUNDLE_VERSION}"
          fi

          echo "Publishing ${BUNDLE_NAME} v${BUNDLE_VERSION} -> ${OCI_REF}"
          go run ./cmd/effectusc bundle \
            --name "${BUNDLE_NAME}" \
            --version "${BUNDLE_VERSION}" \
            --schema-dir "${SCHEMA_DIR}" \
            --verb-dir "${VERB_DIR}" \
            --verbschema "${VERB_SCHEMA}" \
            --rules-dir "${RULES_DIR}" \
            --oci-ref "${OCI_REF}"
          go install github.com/sigstore/cosign/v2/cmd/cosign@v2.4.3
          cosign sign --yes "${OCI_REF}"

  publish-chart:
    needs: validate
    if: github.event_name == 'push' || inputs.publish_chart == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
              echo "version is required for manual branch publication" >&2
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION#v}"
          SEMVER_RE='^[0-9]+\.[0-9]+\.[0-9]+'
          SEMVER_RE="${SEMVER_RE}(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?"
          SEMVER_RE="${SEMVER_RE}(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$"
          if ! printf '%s' "$VERSION" | grep -Eq "$SEMVER_RE"; then
            echo "invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            helm registry login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

      - name: Package chart
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_FILE="charts/effectusd/Chart.yaml"
          VALUES_FILE="charts/effectusd/values.yaml"
          IMAGE_REPO="ghcr.io/${{ github.repository_owner }}/effectusd"
          sed -i "s/^version:.*/version: ${VERSION}/" "$CHART_FILE"
          sed -i \
            "s/^appVersion:.*/appVersion: \"${VERSION}\"/" \
            "$CHART_FILE"
          sed -i \
            "s#^  repository:.*#  repository: ${IMAGE_REPO}#" \
            "$VALUES_FILE"
          sed -i \
            "s/^  tag:.*/  tag: \"${VERSION}\"/" \
            "$VALUES_FILE"
          helm package charts/effectusd --destination dist

      - name: Push chart to GHCR
        env:
          HELM_EXPERIMENTAL_OCI: 1
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHART_REPO="oci://ghcr.io/${{ github.repository_owner }}/helm"
          helm push "dist/effectusd-${VERSION}.tgz" "$CHART_REPO"

  publish-release-assets:
    needs: [validate, publish-image, publish-bundle, publish-chart]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Build release binaries
        run: |
          set -e
          mkdir -p dist
          for target in \
            linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 \
            windows/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            suffix=""
            archive="effectus-${GITHUB_REF_NAME#v}-${GOOS}-${GOARCH}.tar.gz"
            if [ "$GOOS" = windows ]; then
              suffix=".exe"
              archive="effectus-${GITHUB_REF_NAME#v}-${GOOS}-${GOARCH}.zip"
            fi
            work="dist/effectus-${GOOS}-${GOARCH}"
            mkdir -p "$work"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w" \
              -o "$work/effectusc$suffix" ./cmd/effectusc
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags="-s -w" \
              -o "$work/effectusd$suffix" ./cmd/effectusd
            if [ "$GOOS" = windows ]; then
              (cd "$work" && zip -q "../$archive" ./*)
            else
              tar -C "$work" -czf "dist/$archive" .
            fi
            rm -rf "$work"
          done

      - name: Build VS Code extension
        working-directory: tools/vscode-extension
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$release_version" ]; then
            echo "extension version does not match release tag" >&2
            exit 1
          fi
          find . -maxdepth 1 -type f -name '*.vsix' -delete
          npm ci
          npm run package
          vsix="effectus-language-support-${release_version}.vsix"
          test -f "$vsix"
          mv "$vsix" ../../dist/
          (
            cd ../../dist
            sha256sum \
              effectus-"$release_version"-* \
              "$vsix" > SHA256SUMS
          )

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
