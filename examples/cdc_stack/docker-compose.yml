services:
  postgres:
    build:
      context: ./postgres
    image: effectus/postgres-wal2json:16
    environment:
      POSTGRES_USER: effectus
      POSTGRES_PASSWORD: effectus
      POSTGRES_DB: effectus_cdc
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=10
      -c max_wal_senders=10
      -c output_plugin_libraries=wal2json
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mysql:
    build:
      context: ./mysql
    image: effectus/mysql:8.0-secure
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: effectus_cdc
      MYSQL_USER: effectus
      MYSQL_PASSWORD: effectus
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  rabbitmq:
    build:
      context: ./rabbitmq
    image: effectus/rabbitmq:3-management-secure
    ports:
      - "5672:5672"
      - "15672:15672"
