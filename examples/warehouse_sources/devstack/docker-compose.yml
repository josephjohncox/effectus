services:
  minio:
    build:
      context: ./minio
    image: effectus/minio:patched
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-mc:
    build:
      context: ./minio-mc
    image: effectus/minio-mc:patched
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./data:/seed:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/warehouse || true;
      mc mb -p local/exports || true;
      mc anonymous set download local/exports || true;
      sleep infinity;
      "

  trino:
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    depends_on:
      - minio
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro

  trino-cli:
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    depends_on:
      - trino
    entrypoint:
      - trino
      - --server
      - http://trino:8080
      - --catalog
      - lakehouse
      - --schema
      - sales
    stdin_open: true
    tty: true

volumes:
  minio-data: {}
