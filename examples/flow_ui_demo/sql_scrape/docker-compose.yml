services:
  postgres:
    build:
      context: ../../cdc_stack/postgres
    image: effectus/postgres-wal2json:16-secure
    environment:
      POSTGRES_USER: effectus
      POSTGRES_PASSWORD: effectus
      POSTGRES_DB: effectus_ui_demo
    ports:
      - "55432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./scripts:/seed:ro
