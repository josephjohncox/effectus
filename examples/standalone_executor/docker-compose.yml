# yamllint disable rule:line-length
---
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: effectus
      POSTGRES_PASSWORD: effectus
      POSTGRES_DB: effectus
    healthcheck:
      # The entrypoint's temporary initialization server listens only on its
      # Unix socket. Probe the application database through TCP so dependents
      # wait for the final post-initialization server.
      test:
        [
          "CMD-SHELL",
          'pg_isready --host=127.0.0.1 --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  business-executor:
    build:
      context: ../..
      dockerfile: examples/standalone_executor/Dockerfile
    environment:
      BUSINESS_POSTGRES_DSN: postgres://effectus:effectus@postgres:5432/effectus?sslmode=disable
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EXECUTOR_DEMO_HTTP_PORT:-8090}:8090"

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${EFFECTUS_IMAGE:-effectus-demo-current}
    environment:
      EFFECTUS_POSTGRES_DSN: postgres://effectus:effectus@postgres:5432/effectus?sslmode=disable
    command: ["--migrate-only"]
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /data:mode=1777

  effectusd:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${EFFECTUS_IMAGE:-effectus-demo-current}
    # Match the invoking non-root user so the daemon can read the owner-only
    # generated bundle without exposing its executor credential on the host.
    user: "${EFFECTUS_DEMO_UID:-10001}:${EFFECTUS_DEMO_GID:-10001}"
    environment:
      EFFECTUS_API_TOKEN: ${EFFECTUS_API_TOKEN:-}
      EFFECTUS_POSTGRES_DSN: postgres://effectus:effectus@postgres:5432/effectus?sslmode=disable
    command:
      - --bundle
      - /config/bundle.json
      - --http-addr
      - :8080
    depends_on:
      business-executor:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${EFFECTUS_DEMO_HTTP_PORT:-18080}:8080"
    read_only: true
    tmpfs:
      - /data:mode=1777
    volumes:
      - ../../out/standalone_executor/bundle.json:/config/bundle.json:ro

volumes:
  postgres-data:
