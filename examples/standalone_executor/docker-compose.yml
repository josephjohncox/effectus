# yamllint disable rule:line-length
---
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: effectus
      POSTGRES_PASSWORD: effectus
      POSTGRES_DB: effectus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U effectus -d effectus"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "55434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  business-executor:
    build:
      context: ../..
      dockerfile: examples/standalone_executor/Dockerfile
    environment:
      BUSINESS_POSTGRES_DSN: postgres://effectus:effectus@postgres:5432/effectus?sslmode=disable
      EXECUTOR_TOKEN: local-example-only
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      EFFECTUS_POSTGRES_DSN: postgres://effectus:effectus@postgres:5432/effectus?sslmode=disable
    command: ["--database-migrations=apply"]
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /data:mode=1777

  effectusd:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      EFFECTUS_API_TOKEN: effectus-demo-token
      EFFECTUS_POSTGRES_DSN: postgres://effectus:effectus@postgres:5432/effectus?sslmode=disable
    command:
      - --bundle
      - /config/bundle.json
      - --extensions-dir
      - /config/extensions
      - --facts-store
      - memory
      - --http-addr
      - :8080
      - --metrics-addr
      - ""
    depends_on:
      business-executor:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    ports:
      - "18080:8080"
    read_only: true
    tmpfs:
      - /data:mode=1777
    volumes:
      - ../../out/standalone_executor/bundle.json:/config/bundle.json:ro
      - ./extensions:/config/extensions:ro

volumes:
  postgres-data:
