image:
  repository: ghcr.io/josephjohncox/effectusd
  tag: ""
  digest: ""
  # Development only. Production rendering requires an immutable digest.
  unsafeAllowTag: false
  pullPolicy: IfNotPresent

postgres:
  existingSecret: ""
  dsnKey: "dsn"

migrations:
  enabled: false
  existingSecret: ""
  dsnKey: "dsn"
  backoffLimit: 2

grpc:
  enabled: false
  port: 9091
  existingTLSSecret: ""
  certKey: "tls.crt"
  keyKey: "tls.key"

bundle:
  ociRef: ""
  signatureVerifier: ""

api:
  existingSecret: ""
  tokenKey: "api-token"

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

terminationGracePeriodSeconds: 45

# Change this value after externally managed Secrets or gRPC TLS updates.
rolloutNonce: ""
podAnnotations: {}

initContainers: []
extraVolumes: []
extraVolumeMounts: []
